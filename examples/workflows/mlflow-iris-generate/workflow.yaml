apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: mlflow-iris-generate-
  labels:
    app.kubernetes.io/name: mlflow-iris-generate
    app.kubernetes.io/part-of: triton-control-examples
spec:
  entrypoint: train
  artifactRepositoryRef:
    configMap: workflow-s3-training-a1b2c3 # Copy from Configure S3 Secrets.
    key: repository
  ttlStrategy:
    secondsAfterCompletion: 86400
    secondsAfterFailure: 86400
  arguments:
    parameters:
      - name: s3-script-key
        value: workflows/mlflow-iris-generate/train.py
  templates:
    - name: train
      inputs:
        artifacts:
          - name: training-script
            path: /tmp/train.py
            archive:
              none: {}
            s3:
              key: "{{workflow.parameters.s3-script-key}}"
      container:
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["sh", "-ec"]
        args:
          - |
            export HOME=/tmp
            python -m pip install --no-cache-dir --target /tmp/python-packages \
              "mlflow==3.14.0" \
              "mlflow-triton==0.4.1" \
              "numpy==2.2.6" \
              "scikit-learn==1.7.2" \
              "pandas==2.3.3" \
              "cloudpickle==3.1.2"
            export PYTHONPATH="/tmp/python-packages${PYTHONPATH:+:$PYTHONPATH}"
            python /tmp/train.py
        env:
          - name: MLFLOW_EXPERIMENT_NAME
            value: triton-iris-generate
          - name: ARGO_WORKFLOW_NAME
            value: "{{workflow.name}}"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
