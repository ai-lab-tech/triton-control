# HTTPS example: replace domains and issuer with your cluster configuration.
# Create triton-control-db as described in docs/ingress-tls.md first.
postgresql:
  auth:
    existingSecret: triton-control-db

tritonDeployments:
  ingressEnabled: true
  allowHttp: false
  baseDomain: models.example.com
  ingressClassName: traefik
  certManagerClusterIssuer: platform-issuer

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: platform-issuer
  hosts:
    - host: control.example.com
      paths:
        frontend:
          - {path: /, pathType: Prefix}
        backend:
          - {path: /api, pathType: Prefix}
          - {path: /auth, pathType: Prefix}
          - {path: /login, pathType: Prefix}
          - {path: /logout, pathType: Prefix}
          - {path: /whoami, pathType: Prefix}
  tls:
    - hosts: [control.example.com]
      secretName: triton-control-tls
