apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: triton-dev-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - namespace: ai-dept-a
            repo: https://git.example.com/teams/use-case-a.git
          - namespace: ai-dept-b
            repo: https://git.example.com/teams/use-case-b.git
          - namespace: ai-dept-c
            repo: https://git.example.com/teams/use-case-c.git
  template:
    metadata:
      name: '{{ .namespace }}-workloads'
    spec:
      project: '{{ .namespace }}-workloads'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      source:
        repoURL: '{{ .repo }}'
        targetRevision: main
        path: dev/workloads
        directory: {}
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
