apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels: { app: plugin-smoke-seaweedfs }
  template:
    metadata:
      labels: { app: plugin-smoke-seaweedfs }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: seaweedfs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: plugin-smoke-seaweedfs:local
          imagePullPolicy: Never
          command: [weed]
          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -s3.port=9000
            - -admin.ui=false
            - -webdav=false
            - -s3.autoCreateBucket=false
          envFrom:
            - secretRef: { name: plugin-smoke-seaweedfs }
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket: { port: 9000 }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: plugin-smoke-seaweedfs }
  ports:
    - { port: 9000, targetPort: 9000 }
