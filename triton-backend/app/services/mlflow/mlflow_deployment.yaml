{image_pull_secret_manifest}apiVersion: apps/v1
kind: Deployment
metadata:
  name: {deployment_name}
  namespace: {namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
      deployment: {deployment_name}
  template:
    metadata:
      labels:
        app: mlflow
        deployment: {deployment_name}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
{image_pull_secret_reference}      containers:
        - name: mlflow
          image: {image}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
          args:
            - >
              export PYTHONPATH=/tmp/mlflow-packages;
              if ! python -c 'import boto3, psycopg2' 2>/dev/null; then
              python -m pip install --no-cache-dir --target /tmp/mlflow-packages
              'boto3==1.34.122' 'psycopg2-binary==2.9.11'; fi;

              exec mlflow server
              --host 127.0.0.1
              --port 5001
              --allowed-hosts {allowed_hosts}
              --backend-store-uri "$MLFLOW_BACKEND_STORE_URI"
              --serve-artifacts
              --artifacts-destination "$MLFLOW_ARTIFACTS_DESTINATION"
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)"
            periodSeconds: 2
            timeoutSeconds: 2
          env:
            - name: AWS_CA_BUNDLE
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: AWS_CA_BUNDLE
                  optional: true
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: AWS_DEFAULT_REGION
                  optional: false
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: false
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: AWS_ACCESS_KEY_ID
                  optional: false
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: MLFLOW_S3_ENDPOINT_URL
                  optional: false
            - name: MLFLOW_ARTIFACTS_DESTINATION
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: MLFLOW_ARTIFACTS_DESTINATION
                  optional: false
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: {storage_secret_name}
                  key: MLFLOW_BACKEND_STORE_URI
                  optional: false
            - name: AWS_CONFIG_FILE
              value: /etc/mlflow-storage/aws-config
          volumeMounts:
            - name: storage-config
              mountPath: /etc/mlflow-storage
              readOnly: true
        - name: tracking-gateway
          image: {gateway_image}
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: gateway-config
          secret:
            secretName: {gateway_secret_name}
        - name: storage-config
          secret:
            secretName: {storage_secret_name}
---
apiVersion: v1
kind: Service
metadata:
  name: {service_name}
  namespace: {namespace}
spec:
  selector:
    app: mlflow
    deployment: {deployment_name}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
