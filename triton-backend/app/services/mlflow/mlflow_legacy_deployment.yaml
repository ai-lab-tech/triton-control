{image_pull_secret_manifest}apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {data_pvc_name}
  namespace: {namespace}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {deployment_name}
  namespace: {namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
      deployment: {deployment_name}
  template:
    metadata:
      labels:
        app: mlflow
        deployment: {deployment_name}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
{image_pull_secret_reference}      containers:
        - name: mlflow
          image: {image}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
          args:
            - >
              mkdir -p /mlflow-data/artifacts &&
              exec mlflow server
              --host 127.0.0.1
              --port 5001
              --allowed-hosts {allowed_hosts}
              --backend-store-uri sqlite:////mlflow-data/mlflow.db
              --serve-artifacts
              --artifacts-destination /mlflow-data/artifacts
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)"
            periodSeconds: 2
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /mlflow-data
        - name: tracking-gateway
          image: {gateway_image}
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: gateway-config
          secret:
            secretName: {gateway_secret_name}
        - name: data
          persistentVolumeClaim:
            claimName: {data_pvc_name}
---
apiVersion: v1
kind: Service
metadata:
  name: {service_name}
  namespace: {namespace}
spec:
  selector:
    app: mlflow
    deployment: {deployment_name}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
