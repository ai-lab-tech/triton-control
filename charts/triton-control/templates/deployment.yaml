{{- $development := eq (include "triton-control.installationMode" .) "development" -}}
{{- $snapshotVolume := include "triton-control.snapshotVolumeEnabled" . -}}
{{- $releaseSourceFile := (default dict .Values.releaseSources).file -}}
{{- if and .Values.tritonDeployments.ingressTlsSecretName .Values.tritonDeployments.certManagerClusterIssuer }}
{{- fail "Set either tritonDeployments.ingressTlsSecretName or tritonDeployments.certManagerClusterIssuer, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "triton-control.fullname" . }}
  labels:
    {{- include "triton-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  # Startup reconciles a complete source snapshot into the shared database.
  # This also applies when an upgrade removes the last configured source.
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "triton-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "triton-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "triton-control.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSecurity := deepCopy .Values.podSecurityContext }}
      {{- if and $snapshotVolume (not (hasKey $podSecurity "fsGroup")) }}
      {{- $_ := set $podSecurity "fsGroup" 10001 }}
      {{- end }}
      {{- with $podSecurity }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.ports.frontend }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.app.ports.backend }}
              protocol: TCP
          {{- if or .Values.buildQualification.policy $releaseSourceFile $snapshotVolume }}
          volumeMounts:
            {{- if $snapshotVolume }}
            - name: preparation-snapshots
              mountPath: /var/lib/triton-control/preparation
            {{- end }}
            {{- if .Values.buildQualification.policy }}
            - name: build-context-policy
              mountPath: /etc/triton-control/build-context
              readOnly: true
            {{- end }}
            {{- if $releaseSourceFile }}
            - name: release-sources
              mountPath: /etc/triton-control/release-sources
              readOnly: true
            {{- end }}
          {{- end }}
          env:
            {{- if $snapshotVolume }}
            - name: TRITON_PREPARATION_SNAPSHOT_DEFAULT_ROOT
              value: /var/lib/triton-control/preparation/snapshots
            {{- end }}
            - name: TASK_WORKSPACE_RETENTION_DAYS
              value: {{ .Values.development.workspaceRetention.days | quote }}
            - name: TASK_WORKSPACE_INSTALLATION_ID
              value: {{ printf "%s/%s" .Release.Namespace .Release.Name | quote }}
            {{- if $releaseSourceFile }}
            - name: TRITON_RELEASE_SOURCES_FILE
              value: /etc/triton-control/release-sources/sources.json
            {{- end }}
            - name: PREPARATION_MAX_INPUT_GIB
              value: {{ .Values.modelPreparation.maxInputGiB | quote }}
            - name: PREPARATION_MAX_WORKSPACE_STORAGE_GIB
              value: {{ .Values.modelPreparation.maxWorkspaceStorageGiB | quote }}
            - name: PREPARATION_TRANSFER_TIMEOUT_SECONDS
              value: {{ .Values.modelPreparation.transferTimeoutSeconds | quote }}
            {{- if .Values.buildQualification.policy }}
            - name: TRITON_BUILD_POLICY_FILE
              value: /etc/triton-control/build-context/policy.json
            - name: TRITON_BUILD_FIXTURE_REVISION
              value: {{ .Values.buildQualification.fixtureRevision | quote }}
            - name: TRITON_BUILD_CONTEXT_RETENTION_DAYS
              value: {{ .Values.buildQualification.contextRetentionDays | quote }}
            {{- end }}
            {{- if $development }}
            {{- with .Values.candidateValidation.namespace }}
            - name: TRITON_VALIDATION_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- if include "triton-control.localBuildsEnabled" . }}
            - name: TRITON_LOCAL_BUILD_NAMESPACE
              value: {{ (include "triton-control.imageBuilds" . | fromJson).namespace | quote }}
            - name: TRITON_BUILD_DESTINATION_REPOSITORIES
              value: {{ (include "triton-control.imageBuilds" . | fromJson).destinationRepositories | toJson | quote }}
            {{- end }}
            - name: TRITON_BUILD_DEFAULT_EXECUTOR
              value: {{ include "triton-control.builderImage" . | quote }}
            - name: PERF_ANALYZER_IMAGE
              value: {{ .Values.perfAnalyzer.image | quote }}
            - name: PERF_ANALYZER_DEADLINE_SECONDS
              value: {{ .Values.perfAnalyzer.deadlineSeconds | quote }}
            - name: PERF_ANALYZER_CPU_REQUEST
              value: {{ .Values.perfAnalyzer.resources.requests.cpu | quote }}
            - name: PERF_ANALYZER_MEMORY_REQUEST
              value: {{ .Values.perfAnalyzer.resources.requests.memory | quote }}
            - name: PERF_ANALYZER_CPU_LIMIT
              value: {{ .Values.perfAnalyzer.resources.limits.cpu | quote }}
            - name: PERF_ANALYZER_MEMORY_LIMIT
              value: {{ .Values.perfAnalyzer.resources.limits.memory | quote }}
            - name: MLFLOW_VERSION
              value: {{ .Values.mlflow.version | quote }}
            - name: MLFLOW_IMAGE_REPOSITORY
              value: {{ .Values.mlflow.image.repository | quote }}
            - name: MLFLOW_GATEWAY_IMAGE
              value: {{ .Values.mlflow.gatewayImage | quote }}
            - name: ARGO_WORKFLOWS_WORKFLOW_SERVICE_ACCOUNT
              value: {{ .Values.argoWorkflows.controller.workflowDefaults.spec.serviceAccountName | quote }}
            {{- end }}
            - name: TRITON_DEPLOY_BASE_DOMAIN
              value: {{ .Values.tritonDeployments.baseDomain | default "" | quote }}
            - name: TRITON_DEPLOY_INGRESS_ENABLED
              value: {{ .Values.tritonDeployments.ingressEnabled | quote }}
            - name: TRITON_DEPLOY_ALLOW_HTTP
              value: {{ .Values.tritonDeployments.allowHttp | default false | quote }}
            - name: TRITON_DEPLOY_INGRESS_CLASS
              value: {{ .Values.tritonDeployments.ingressClassName | default "traefik" | quote }}
            - name: TRITON_DEPLOY_INGRESS_TLS_SECRET
              value: {{ .Values.tritonDeployments.ingressTlsSecretName | default "" | quote }}
            - name: TRITON_DEPLOY_CERT_MANAGER_CLUSTER_ISSUER
              value: {{ .Values.tritonDeployments.certManagerClusterIssuer | default "" | quote }}
            - name: TRITON_DEPLOY_INGRESS_HTTP_ENTRYPOINT
              value: {{ .Values.tritonDeployments.ingressHttpEntrypoint | default "web" | quote }}
            - name: TRITON_DEPLOY_INGRESS_HTTPS_ENTRYPOINT
              value: {{ .Values.tritonDeployments.ingressHttpsEntrypoint | default "websecure" | quote }}
            - name: TRITON_DEPLOY_S3_SYNC_IMAGE
              value: {{ .Values.tritonDeployments.s3SyncImage | quote }}
            - name: TRITON_DEPLOY_MODEL_REPOSITORY_EMPTYDIR_SIZE
              value: {{ .Values.tritonDeployments.modelRepositoryEmptyDirSize | quote }}
            - name: TRITON_DEPLOY_S3_SYNC_STAGING_EMPTYDIR_SIZE
              value: {{ .Values.tritonDeployments.s3SyncStagingEmptyDirSize | quote }}
            - name: TRITON_DEPLOY_PROBES_JSON
              value: {{ .Values.tritonDeployments.probes | toJson | quote }}
            {{- if $development }}
            {{- with .Values.mlflow.backendStoreSecret }}
            {{- if .name }}
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ required "mlflow.backendStoreSecret.key is required" .key | quote }}
            {{- end }}
            {{- end }}
            - name: DEVELOPMENT_PROFILE_API_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "triton-control.fullname" .) .Release.Namespace .Values.service.backendPort | quote }}
            - name: DEVELOPMENT_CODE_SERVER_VERSION
              value: {{ .Values.development.codeServer.version | quote }}
            - name: DEVELOPMENT_HF_BUILDER_VERSION
              value: {{ .Values.development.hfBuilder.version | quote }}
            - name: DEVELOPMENT_MLFLOW_VERSION
              value: {{ .Values.development.mlflow.version | quote }}
            - name: DEVELOPMENT_MLFLOW_TRITON_CONTROL_VERSION
              value: {{ .Values.development.mlflow.tritonControlVersion | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.app.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "triton-control.postgresqlSecretName" . }}
                  key: database-url
            {{- end }}
            {{- if $development }}
            - name: ARGO_WORKFLOWS_ENABLED
              value: {{ .Values.argoWorkflows.enabled | quote }}
            - name: ARGO_WORKFLOWS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ARGO_WORKFLOWS_SERVICE_NAME
              value: {{ default "argo-workflows-server" .Values.argoIntegration.serviceName | quote }}
            - name: ARGO_WORKFLOWS_SERVER_URL
              value: {{ default (printf "http://argo-workflows-server.%s.svc.cluster.local:%v" .Release.Namespace .Values.argoWorkflows.server.servicePort) .Values.argoIntegration.serverUrl | quote }}
            - name: ARGO_WORKFLOWS_BASE_PATH
              value: {{ .Values.argoIntegration.basePath | quote }}
            {{- end }}
          envFrom:
            {{- if .Values.app.existingSecret }}
            - secretRef:
                name: {{ .Values.app.existingSecret }}
            {{- else }}
            - secretRef:
                name: {{ include "triton-control.fullname" . }}-app
            {{- end }}
            {{- with .Values.app.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.readiness.path }}
              port: api
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.liveness.path }}
              port: api
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.liveness.periodSeconds }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.buildQualification.policy $releaseSourceFile $snapshotVolume }}
      volumes:
        {{- if $snapshotVolume }}
        - name: preparation-snapshots
          persistentVolumeClaim:
            claimName: {{ include "triton-control.fullname" . }}-snapshots
        {{- end }}
        {{- if .Values.buildQualification.policy }}
        - name: build-context-policy
          configMap:
            name: {{ include "triton-control.fullname" . }}-build-context-policy
        {{- end }}
        {{- if $releaseSourceFile }}
        - name: release-sources
          configMap:
            name: {{ include "triton-control.releaseSourcesConfigMapName" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
