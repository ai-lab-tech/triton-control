{{- if not .Values.app.existingSecret }}
{{- $secretName := printf "%s-app" (include "triton-control.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "triton-control.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $values := merge (deepCopy (default dict .Values.app.secretEnv)) (dict
    "SESSION_SECRET" "" "JWT_SECRET" "" "S3_SECRET_ENCRYPTION_KEY" "") }}
  {{- range $key, $value := $values }}
  {{- $existingValue := "" -}}
  {{- if and $existing $existing.data (hasKey $existing.data $key) -}}
    {{- $existingValue = (index $existing.data $key | b64dec) -}}
  {{- end -}}
  {{- $resolved := $value -}}
  {{- if not $resolved -}}
    {{- $resolved = $existingValue -}}
  {{- end -}}
  {{- if and (eq $key "S3_SECRET_ENCRYPTION_KEY") $existingValue $value (ne $existingValue $value) -}}
    {{- fail "The configured S3 encryption key differs from the deployed Secret. Restore the original key before upgrading." -}}
  {{- end -}}
  {{- if not $resolved -}}
    {{- if eq $key "S3_SECRET_ENCRYPTION_KEY" -}}
      {{- if or $.Release.IsUpgrade $existing -}}
        {{- fail "Restore S3_SECRET_ENCRYPTION_KEY from backup or supply the original key in app.secretEnv before upgrading." -}}
      {{- end -}}
      {{- $resolved = randAlphaNum 64 -}}
    {{- else if has $key (list "SESSION_SECRET" "JWT_SECRET") -}}
    {{- fail (printf "Set a stable app.secretEnv.%s or reference a Secret with app.existingSecret" $key) -}}
    {{- end -}}
  {{- end }}
  {{- if $resolved }}
  {{ $key }}: {{ $resolved | quote }}
  {{- end }}
  {{- end }}
{{- end }}
