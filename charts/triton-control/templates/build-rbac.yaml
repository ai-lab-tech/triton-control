{{- if and .Values.rbac.create .Values.buildQualification.policy }}
{{- if eq .Values.buildQualification.policy.namespace .Release.Namespace }}
{{- fail "Build execution requires a namespace separate from the application namespace" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "triton-control.fullname" . }}-builds
  namespace: {{ .Values.buildQualification.policy.namespace | quote }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "triton-control.fullname" . }}-builds
  namespace: {{ .Values.buildQualification.policy.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "triton-control.fullname" . }}-builds
subjects:
  - kind: ServiceAccount
    name: {{ include "triton-control.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
