name: Publish MLflow plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "mlflow-plugin-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("plugins/mlflow-triton-control/pyproject.toml").read_text())["project"]
          if os.environ["RELEASE_REF"].startswith("refs/tags/"):
              assert os.environ["RELEASE_TAG"] == "mlflow-plugin-v" + project["version"]
          print("Publishing", project["name"], project["version"])
          PYTHON
      - name: Build and test distributions
        run: |
          python -m pip install build twine ruff
          python -m build --outdir dist plugins/mlflow-triton-control
          python -m twine check dist/*
          python -m pip install dist/*.whl "mlflow==3.14.0"
          python -m pip check
          ruff check plugins/mlflow-triton-control/mlflow_triton_control plugins/mlflow-triton-control/tests
          ruff format --check plugins/mlflow-triton-control/mlflow_triton_control plugins/mlflow-triton-control/tests
          python -m unittest discover -s plugins/mlflow-triton-control/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: mlflow-plugin-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mlflow-triton-control/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mlflow-plugin-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
