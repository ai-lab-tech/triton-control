name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "triton-backend/**"
      - "contracts/candidate-import/**"
      - "contracts/serving/**"
      - "contracts/materialization/**"
      - "contracts/validation/**"
      - "examples/workflows/**"
      - "code-server-extensions/**"
      - "triton-frontend/openapi/triton-backend/openapi.json"
      - "Dockerfile"
      - "compose.yaml"
      - "podman-compose.yaml"
      - "charts/triton-control/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "triton-backend/**"
      - "contracts/candidate-import/**"
      - "contracts/serving/**"
      - "contracts/materialization/**"
      - "contracts/validation/**"
      - "examples/workflows/**"
      - "code-server-extensions/**"
      - "triton-frontend/openapi/triton-backend/openapi.json"
      - "Dockerfile"
      - "compose.yaml"
      - "podman-compose.yaml"
      - "charts/triton-control/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  materializer-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - name: Install qualification tools
        run: pip install -e './triton-backend[dev]'
      - name: Qualify the actual pinned helper and read-only Kubernetes mount
        env:
          PYTHON_BASE_IMAGE: python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          MATERIALIZER_EVIDENCE_DIR: ${{ runner.temp }}/materializer-evidence
        run: bash triton-backend/scripts/ci_materializer.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: materializer-qualification-linux-amd64
          path: ${{ runner.temp }}/materializer-evidence
          if-no-files-found: error

  serving-metadata-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and contract tools
        run: pip install -e './triton-backend[dev]' wheel
      - name: Verify schemas, golden identities and rejection behavior
        working-directory: triton-backend
        run: |
          python scripts/export_validation_schema.py --check
          python scripts/generate_validation_fixtures.py --check
          python -m unittest tests.test_validation_contracts -v
          python -m app.services.validation_cli ../contracts/validation/v1alpha1/fixtures/manifest.json ../contracts/validation/v1alpha1/fixtures/report-passed.yaml ../contracts/validation/v1alpha1/fixtures/evidence.json
          python scripts/export_serving_metadata_schema.py --check
          python scripts/generate_serving_metadata_fixtures.py --check
          python -m unittest discover -s tests -p test_serving_metadata.py -v
          python -m unittest discover -s tests -p test_lineage.py -v
          python scripts/validate_serving_metadata.py ../contracts/serving/v1alpha1/fixtures/release-manual.yaml ../contracts/serving/v1alpha1/fixtures/target.json ../contracts/serving/v1alpha1/fixtures/source-git.yaml ../contracts/serving/v1alpha1/fixtures/source-s3.json
      - name: Verify installed schemas and CLI outside the checkout
        run: |
          pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/serving-wheel" ./triton-backend
          pip install --no-deps --target "$RUNNER_TEMP/serving-installed" "$RUNNER_TEMP"/serving-wheel/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/serving-installed" python -m app.services.validation_cli "$GITHUB_WORKSPACE/contracts/validation/v1alpha1/fixtures/manifest.json"
          PYTHONPATH="$RUNNER_TEMP/serving-installed" "$RUNNER_TEMP/serving-installed/bin/triton-validate-evidence" "$GITHUB_WORKSPACE/contracts/validation/v1alpha1/fixtures/evidence.yaml"
          PYTHONPATH="$RUNNER_TEMP/serving-installed" python -m app.services.serving_metadata_cli "$GITHUB_WORKSPACE/contracts/serving/v1alpha1/fixtures/release-manual.yaml"
          PYTHONPATH="$RUNNER_TEMP/serving-installed" "$RUNNER_TEMP/serving-installed/bin/triton-validate-metadata" "$GITHUB_WORKSPACE/contracts/serving/v1alpha1/fixtures/source-s3.json"

  pod-contracts-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0
      - name: Create isolated Kubernetes test cluster
        run: kind create cluster --name pods-contract --image kindest/node:v1.37.0 --kubeconfig "$RUNNER_TEMP/pods-kubeconfig" --wait 60s
      - name: Install backend
        working-directory: triton-backend
        run: pip install -e ".[dev]"
      - name: Verify real workload ownership, rollout and container logs
        working-directory: triton-backend
        env:
          PODS_TEST_KUBECONFIG: ${{ runner.temp }}/pods-kubeconfig
        run: python -m unittest tests.test_pods_kubernetes tests.test_experiment_snapshots_kubernetes -v
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name pods-contract

  teams-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teams_test
          POSTGRES_PASSWORD: teams_test
          POSTGRES_DB: teams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teams_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: triton-backend
        run: pip install -e ".[dev]"
      - uses: helm/kind-action@v1.12.0
      - name: Verify teams, operations and deployment recovery on PostgreSQL and Kubernetes
        working-directory: triton-backend
        env:
          PREPARATION_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
          TEAMS_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
          OPERATIONS_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
          DEPLOYMENT_TEST_KUBERNETES: "1"
          TASK_WORKSPACE_TEST_KUBERNETES: "1"
          BUILD_TEST_KUBERNETES: "1"
          BUILD_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
        run: |
          export KUBERNETES_KUBECONFIG_PATH="$HOME/.kube/config"
          python -m unittest tests.test_teams_postgres tests.test_preparation_postgres tests.test_candidate_validation_postgres tests.test_engineering_queue_postgres tests.test_handoffs_postgres tests.test_control_lineage_postgres tests.test_handoff_repositories_postgres tests.test_handoff_capture_postgres tests.test_operations_postgres tests.test_deployment_operations_postgres tests.test_deployment_operations_kubernetes tests.test_task_workspaces_postgres tests.test_task_workspaces_kubernetes tests.test_builds_postgres tests.test_build_ui_postgres tests.test_builds_kubernetes -v
      - name: Verify builder qualification persistence with PostgreSQL
        working-directory: triton-backend
        env:
          BUILD_QUALIFICATION_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
        run: python -m unittest tests.test_build_qualification -v

      - name: Verify experiment snapshots and recovery with PostgreSQL
        working-directory: triton-backend
        env:
          SNAPSHOTS_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
        run: python -m unittest tests.test_experiment_snapshots_postgres -v

      - name: Verify local bindings and concurrent policy updates with PostgreSQL
        working-directory: triton-backend
        env:
          LOCAL_BINDINGS_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
        run: python -m unittest tests.test_local_bindings_postgres -v

      - name: Verify production cutover and credential concurrency
        working-directory: triton-backend
        env:
          INSTALLATION_TEST_DATABASE_URL: postgresql://teams_test:teams_test@localhost:5432/teams_test
          INSTALLATION_TEST_KUBERNETES: "1"
        run: |
          export KUBERNETES_KUBECONFIG_PATH="$HOME/.kube/config"
          python -m unittest tests.test_installation_policy_postgres tests.test_installation_policy_kubernetes -v

  handoff-source-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: triton-backend
        run: pip install -e ".[dev]"
      - name: Start pinned SeaweedFS test storage
        env:
          AWS_ACCESS_KEY_ID: handoff_test
          AWS_SECRET_ACCESS_KEY: handoff_test_password
        run: bash triton-backend/scripts/ci_s3_start.sh handoff-s3
      - name: Verify exact source versions and access failures
        working-directory: triton-backend
        env:
          HANDOFF_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          REPOSITORY_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: handoff_test
          AWS_SECRET_ACCESS_KEY: handoff_test_password
        run: python -m unittest tests.test_handoff_s3_integration tests.test_handoff_repositories_s3 -v
      - name: Collect S3 diagnostics and remove test storage
        if: always()
        run: |
          docker logs handoff-s3 > "$RUNNER_TEMP/handoff-s3.log" 2>&1 || true
          docker rm -f handoff-s3 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: handoff-s3-log
          path: ${{ runner.temp }}/handoff-s3.log

  candidate-import-postgres-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: candidate_test
          POSTGRES_PASSWORD: candidate_test
          POSTGRES_DB: candidate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: triton-backend
        run: pip install -e ".[dev]"
      - name: Check shared importer schemas
        working-directory: triton-backend
        run: |
          python scripts/export_candidate_import_schema.py
          git diff --exit-code -- ../contracts/candidate-import
      - name: Start pinned SeaweedFS test storage
        env:
          AWS_ACCESS_KEY_ID: candidate_test
          AWS_SECRET_ACCESS_KEY: candidate_test_password
        run: bash triton-backend/scripts/ci_s3_start.sh candidate-s3
      - name: Verify import, concurrency, retention and recovery
        working-directory: triton-backend
        env:
          CANDIDATE_IMPORT_TEST_DATABASE_URL: postgresql://candidate_test:candidate_test@localhost:5432/candidate_test
          LINEAGE_TEST_DATABASE_URL: postgresql://candidate_test:candidate_test@localhost:5432/candidate_test
          CANDIDATE_IMPORT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: |
          python -m unittest tests.test_candidate_import tests.test_candidate_s3 tests.test_candidate_import_postgres tests.test_candidate_import_s3_integration tests.test_materialization_s3 tests.test_lineage tests.test_lineage_postgres tests.test_experiment_snapshots_s3 -v
      - name: Verify build context staging, concurrency and versioned retention
        working-directory: triton-backend
        env:
          BUILD_CONTEXT_TEST_DATABASE_URL: postgresql://candidate_test:candidate_test@localhost:5432/candidate_test
          BUILD_CONTEXT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          BUILD_CONTEXT_TEST_S3_ACCESS_KEY: candidate_test
          BUILD_CONTEXT_TEST_S3_SECRET_KEY: candidate_test_password
        run: python -m unittest tests.test_build_contexts tests.test_build_contexts_postgres tests.test_build_contexts_s3 -v
      - name: Collect S3 diagnostics and remove test storage
        if: always()
        run: |
          docker logs candidate-s3 > "$RUNNER_TEMP/candidate-s3.log" 2>&1 || true
          docker rm -f candidate-s3 || true
      - name: Upload S3 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-import-s3-diagnostics
          path: ${{ runner.temp }}/candidate-s3.log

  workspace-connections-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4.3.0
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Test code-server connections to MLflow and Argo
        run: bash triton-backend/scripts/ci_workspace_connections.sh

  iris-example-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install example training dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.7.2
      - name: Test registration paths and failure handling
        run: python -m unittest discover -s examples/workflows/tests -v

  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test code-server extension
        working-directory: code-server-extensions/triton-deploy
        run: npm test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest detect --no-git --source . --redact --verbose

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triton-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Run pip-audit
        timeout-minutes: 10
        shell: bash
        run: |
          audit_log=$(mktemp)
          trap 'rm -f "$audit_log"' EXIT
          for attempt in 1 2 3; do
            if pip-audit --timeout 60 --progress-spinner off 2>&1 | tee "$audit_log"; then
              exit 0
            else
              audit_status=${PIPESTATUS[0]}
            fi
            # Retry transport failures only. Vulnerability findings and other
            # audit failures retain their nonzero exit status immediately.
            if ! grep -Eq '(requests.exceptions.(ReadTimeout|ConnectTimeout|ConnectionError)|urllib3.exceptions.(ReadTimeoutError|ConnectTimeoutError|NewConnectionError)|TimeoutError:.*timed out)' "$audit_log" || [ "$attempt" -eq 3 ]; then
              exit "$audit_status"
            fi
            echo "::warning::pip-audit transport failure; retrying ($attempt/3)."
            sleep "$((attempt * 10))"
          done

      - name: Check OpenAPI specs are current
        run: |
          python scripts/export_openapi.py

          FRONTEND_SPEC="../triton-frontend/openapi/triton-backend/openapi.json"

          python - <<'PY'
          import json
          from pathlib import Path

          backend = json.loads(Path("openapi.json").read_text(encoding="utf-8"))
          frontend = json.loads(Path("../triton-frontend/openapi/triton-backend/openapi.json").read_text(encoding="utf-8"))
          if backend != frontend:
              raise SystemExit(
                  "Frontend OpenAPI spec copy is stale. Run python scripts/export_openapi.py, "
                  "copy triton-backend/openapi.json to triton-frontend/openapi/triton-backend/openapi.json, "
                  "then regenerate the frontend client."
              )
          PY

          git diff --exit-code -- openapi.json "$FRONTEND_SPEC" || {
            echo "::error::Checked-in OpenAPI spec is stale. Run python scripts/export_openapi.py and commit the result."
            exit 1
          }

      - name: Run unit tests
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=75
          python scripts/coverage_summary.py

      - name: Run mypy
        run: mypy app/ tests/ scripts/ main.py

      - name: Run ruff
        run: ruff check app/ main.py

      - name: Run import-linter
        run: lint-imports

      - name: Run bandit
        run: bandit -r app/ main.py
