name: Code-server plugin smoke

on:
  pull_request:
    paths:
      - "code-server-extensions/**"
      - "triton-backend/app/services/development/**"
      - "triton-backend/app/api/development_api.py"
      - "triton-frontend/src/app/pages/development/**"
      - "triton-frontend/e2e/code-server/**"
      - "triton-frontend/package*.json"
      - "charts/triton-control/**"
      - "docker/**"
      - "Dockerfile"
      - ".github/workflows/code-server-smoke.yml"
      - ".github/workflows/hf-builder-compatibility.yml"
      - "triton-backend/scripts/hf_builder_release.py"
  workflow_dispatch:
    inputs:
      candidate_version:
        description: "Optional code-server version to test after upgrading the baseline workspace"
        required: false
        type: string
      hf_builder_version:
        description: "Optional published HF builder version; defaults to the tested version"
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_version:
        required: false
        default: ""
        type: string
      hf_builder_version:
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: code-server-smoke-${{ github.workflow }}-${{ github.ref }}-${{ inputs.hf_builder_version }}
  cancel-in-progress: true

jobs:
  hf-builder-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve exact builder version
        id: builder
        env:
          CANDIDATE: ${{ inputs.hf_builder_version }}
        run: |
          python -m pip install --disable-pip-version-check packaging
          version=$(python triton-backend/scripts/hf_builder_release.py pin --version "$CANDIDATE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install published builder and notebook kernel
        env:
          BUILDER_VERSION: ${{ steps.builder.outputs.version }}
        run: python -m pip install --disable-pip-version-check "triton-hf-builder==$BUILDER_VERSION" 'ipykernel>=6,<8'
      - name: Test real extension client, Python API and notebook kernel
        env:
          HF_BUILDER_INTEGRATION_PYTHON: python
          HF_BUILDER_EXPECTED_VERSION: ${{ steps.builder.outputs.version }}
        run: node --test code-server-extensions/triton-deploy/test/hf-builder-integration.test.js
      - name: Check generated version documentation
        run: python triton-backend/scripts/hf_builder_release.py check

  browser-smoke:
    needs: hf-builder-contract
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require successful package contract
        env:
          CONTRACT_RESULT: ${{ needs.hf-builder-contract.result }}
        run: |
          if [ "$CONTRACT_RESULT" != 'success' ]; then
            echo '::error::HF builder package contract did not pass.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: triton-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.2
      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/kind-bin"
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind-bin/kind"
          chmod +x "$RUNNER_TEMP/kind-bin/kind"
          echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: |
          python -m pip install boto3==1.34.122 packaging
          npm ci --prefix triton-frontend
          cd triton-frontend
          npx playwright install --with-deps chromium
      - name: Extension unit tests
        working-directory: code-server-extensions/triton-deploy
        run: npm test
      - name: Test real workspace workflows
        env:
          PLUGIN_SMOKE_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PLUGIN_SMOKE_HF_BUILDER_VERSION: ${{ inputs.hf_builder_version }}
        run: bash triton-frontend/e2e/code-server/run.sh
      - name: Test fresh candidate installation
        if: inputs.candidate_version != ''
        env:
          PLUGIN_SMOKE_VERSION: ${{ inputs.candidate_version }}
          PLUGIN_SMOKE_PHASE: fresh-candidate
          PLUGIN_SMOKE_SKIP_BUILD: "true"
          PLUGIN_SMOKE_HF_BUILDER_VERSION: ${{ inputs.hf_builder_version }}
        run: bash triton-frontend/e2e/code-server/run.sh
      - name: Upload browser traces and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-server-plugin-smoke
          path: |
            triton-frontend/test-results/
            triton-frontend/playwright-report/
          retention-days: 7
