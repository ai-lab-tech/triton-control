[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-triton-control"
version = "0.2.0"
description = "MLflow deployment target for Triton Control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mlflow>=3.14,<4", "httpx>=0.27,<1"]

[project.entry-points."mlflow.deployments"]
triton-control = "mlflow_triton_control.deployment_client"

[tool.setuptools.packages.find]
include = ["mlflow_triton_control*"]
