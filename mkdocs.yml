site_name: Triton Control
site_description: Documentation for the Triton Control frontend, backend, and deployment workflows.
repo_url: https://github.com/ai-lab-tech/triton-control
theme:
  name: material
  logo: assets/images/triton-control-icon.svg
  favicon: assets/images/triton-control-icon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Product:
    - User Guide: user-guide.md
    - User Management: user-management.md
    - Preparation Tasks: preparation-tasks.md
    - Validation Contracts: validation-contracts.md
    - Scientist Handoffs: scientist-handoffs.md
    - Experiment Snapshots: experiment-snapshots.md
    - Candidate Import: candidate-import.md
    - Build Contexts: build-contexts.md
    - Workspaces: development-workspaces.md
    - Task Workspaces: task-workspaces.md
    - Argo Workflows: argo-workflows.md
  - Architecture:
    - Overview: architecture-overview.md
    - Backend Components: architecture-backend-components.md
    - Local Credential Bindings: local-bindings.md
    - Model Config Validation: model-config-validation.md
  - Operations:
    - Configuration: configuration.md
    - Deployment: deployment.md
    - Pod state and logs: pod-visibility.md
    - Immutable materialization: immutable-materialization.md
    - Ingress and TLS Setup: ingress-tls.md
    - Security: security.md
    - Troubleshooting: troubleshooting.md
  - Reference:
    - API: api.md
  - Project:
    - Roadmap: roadmap.md
    - Local Project Development: development.md
    - Minikube Test Environment: local-kubernetes.md

markdown_extensions:
  - admonition
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

extra_css:
  - assets/stylesheets/home-nav.css
